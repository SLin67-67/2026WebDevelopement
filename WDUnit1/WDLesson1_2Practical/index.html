<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
  <body>
    <!-- Example of an image from external source
        <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png">
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
    <h1>External Source Images</h1>
    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
      <img src="https://domf5oio6qrcr.cloudfront.net/medialibrary/6372/202ebeef-6657-44ec-8fff-28352e1f5999.jpg"height=400>
    <!-- Challenge 3: Add three more of the same image.  Change the width and height of each image to 
     be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
      <img src="https://domf5oio6qrcr.cloudfront.net/medialibrary/6372/202ebeef-6657-44ec-8fff-28352e1f5999.jpg" height=200 width=200>
     <img src="https://domf5oio6qrcr.cloudfront.net/medialibrary/6372/202ebeef-6657-44ec-8fff-28352e1f5999.jpg" height=150 width=150>
     <img src="https://domf5oio6qrcr.cloudfront.net/medialibrary/6372/202ebeef-6657-44ec-8fff-28352e1f5999.jpg"height=100 width=100>
  <hr>
  <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png">
  -->
  <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
    <h1>Internal Source Images</h1>
  <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
    <img src="HulkLogo2.jpg">

  <hr>
  <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png">
  -->  

  <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
<h1>Internal Source Images Inside Folders</h1>
  <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. 
                   Both images are located in the images folder to the page -->
    <img src="images/HulkSmash2.png">
    <img src="images/HulkSmash3.jpg">
  <hr>
  <!-- Challenge Bonus: Create a heading with "Marvel Superheroes".  Add a horizontal rule.  
   Add five images of Marvel Superheroes.  Make them all the same size -->
   <img src="https://static.wikia.nocookie.net/marvelcinematicuniverse/images/b/b5/Loki_Infobox.png/revision/latest/thumbnail/width/360/height/450?cb=20250203204518"height=400 width="400">
    <img src="https://upload.wikimedia.org/wikipedia/en/3/3c/Chris_Hemsworth_as_Thor.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"height=400 width="400">
    <img src="https://cdn11.bigcommerce.com/s-ydriczk/images/stencil/1280w/products/89054/93425/Aquaman-Jason-Momoa-official-cardboard-cutout-buy-now-at-starstills__84598.1582849792.jpg?c=2"height=400 width="400">
    <img src="https://static.wikia.nocookie.net/marvelcinematicuniverse/images/9/9d/Captain_America_Infobox.jpg/revision/latest?cb=20250117164205"height=400 width="400">
    <img src="https://thumb.wikimedia.org/wikipedia/en/thumb/1/18/Benedict_Cumberbatch_as_Doctor_Strange.jpeg/250px-Benedict_Cumberbatch_as_Doctor_Strange.jpeg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"height=400 width="400">


  </body>
</html>
